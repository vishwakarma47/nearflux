services:
  - type: web
    name: nearflux
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix server ci --include=dev && npm --prefix client ci --include=dev && npm run build
    startCommand: node server/dist/server/src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: RENDER_EXTERNAL_URL
        value: https://nearflux-p2p-share.onrender.com
      - key: TELEGRAM_BRIDGE_MODE
        value: remote
      - key: BRIDGE_SHARED_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBAPP_URL
        value: https://nearflux-p2p-share.onrender.com/
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_MAX_FILE_BYTES
        value: '20971520'
