services:
  - type: web
    name: nearflux
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix server ci --include=dev && npm --prefix client ci --include=dev && npm run build
    startCommand: node server/dist/server/src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: RENDER_EXTERNAL_URL
        value: https://nearflux-p2p-share.onrender.com
